    <style>
        body {
            font-family: 'Manrope', sans-serif;
            background-color: #FAF9F6;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: #FFFFFF;
            box-shadow: 0px 4px 20px rgba(0,0,0,0.04);
            border: 1px solid #eeedf2;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen">
    <!-- Side Navigation Bar -->
    <div id="sidebar-container"></div>
    
    <!-- Top Navigation Bar -->
    <div id="topnav-container"></div>
    
    <!-- Main Content -->
    <main class="ml-[280px] min-h-screen">
        <div id="cycles-create-content"></div>
    </main>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Load Sidebar
            fetch('/ME-GB/components/sidebar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sidebar-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading sidebar:', error));
            
            // Load TopNav
            fetch('/ME-GB/components/topnav.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('topnav-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading topnav:', error));
            
            // Load Create Cycle Content
            fetch('/ME-GB/regiao-create.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-create-content').innerHTML = data;
                    loadCreateSections();
                })
                .catch(error => console.error('Error loading create cycle content:', error));
        });
        
        function loadCreateSections() {
            // Load Breadcrumbs
            fetch('/ME-GB/sections/cycles-breadcrumbs.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-breadcrumbs-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading breadcrumbs:', error));
            
            // Load Header
            fetch('/ME-GB/sections/cycles-create-header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-create-header-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading create header:', error));
            
            // Load Form
            fetch('/ME-GB/sections/cycles-create-form.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-form-container').innerHTML = data;
                    initFormInteractions();
                })
                .catch(error => console.error('Error loading form:', error));
            
            // Load Tips
            fetch('/ME-GB/sections/cycles-create-tips.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-create-tips-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading create tips:', error));
        }
        
        function initFormInteractions() {
            document.querySelectorAll('input, textarea').forEach(element => {
                element.addEventListener('focus', () => {
                    element.parentElement.querySelector('label')?.classList.add('text-primary');
                });
                element.addEventListener('blur', () => {
                    element.parentElement.querySelector('label')?.classList.remove('text-primary');
                });
            });
        }
    </script>
</body>
</html>
