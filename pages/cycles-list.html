    <style>
        body { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .soft-card-shadow {
            box-shadow: 0px 4px 20px rgba(0,0,0,0.04);
        }
        .canvas-bg {
            background-color: #FAF9F6;
        }
    </style>
</head>
<body class="canvas-bg text-on-surface">
    <!-- Side Navigation Bar -->
    <div id="sidebar-container"></div>
    
    <!-- Top Navigation Bar -->
    <div id="topnav-container"></div>
    
    <!-- Main Content Canvas -->
    <main class="ml-[280px] pt-20 min-h-screen">
        <div id="cycles-list-content"></div>
    </main>

    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white rounded-[24px] p-8 max-w-md w-full mx-4 card-shadow">
            <div class="flex items-center justify-center w-16 h-16 rounded-full bg-error-container/20 mx-auto mb-4">
                <span class="material-symbols-outlined text-error text-4xl">delete_forever</span>
            </div>
            <h3 class="text-headline-sm font-headline-sm text-on-surface text-center mb-2">Confirmar Eliminação</h3>
            <p class="text-body-md text-on-surface-variant text-center mb-6">Tem a certeza que deseja eliminar a região <span id="deleteRegionName" class="font-bold text-primary"></span>? Esta ação não pode ser desfeita.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 px-4 py-3 rounded-full border border-secondary text-secondary font-bold hover:bg-surface-container-low transition-all">
                    Cancelar
                </button>
                <button onclick="confirmDelete()" class="flex-1 px-4 py-3 rounded-full bg-error text-white font-bold hover:bg-error/90 transition-all shadow-sm">
                    Eliminar
                </button>
            </div>
        </div>
    </div>
    
    <script>
        // Load all components
        document.addEventListener('DOMContentLoaded', function() {
            // Load Sidebar
            fetch('/ME-GB/components/sidebar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('sidebar-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading sidebar:', error));
            
            // Load TopNav
            fetch('/ME-GB/components/topnav.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('topnav-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading topnav:', error));
            
            // Load Cycles List Content
            fetch('/ME-GB/regiao.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-list-content').innerHTML = data;
                    loadCyclesSections();
                })
                .catch(error => console.error('Error loading cycles content:', error));
        });
        
        function loadCyclesSections() {
            // Load Header
            fetch('/ME-GB/sections/cycles-header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-header-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading cycles header:', error));
            
            // Load Stats
            fetch('/ME-GB/sections/cycles-stats.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-stats-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading cycles stats:', error));
            
            // Load Table
            fetch('/ME-GB/sections/cycles-table.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-table-container').innerHTML = data;
                    initTableSearch();
                })
                .catch(error => console.error('Error loading cycles table:', error));
            
            // Load Tips
            fetch('/ME-GB/sections/cycles-tips.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('cycles-tips-container').innerHTML = data;
                })
                .catch(error => console.error('Error loading cycles tips:', error));
        }

        let deleteId = null;
        
        function openDeleteModal(id, name) {
            deleteId = id;
            document.getElementById('deleteRegionName').textContent = name;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
            deleteId = null;
        }
        
        function confirmDelete() {
            // Here you would typically make an API call to delete the region
            console.log('Deleting region with ID:', deleteId);
            // Show success message or refresh table
            alert('Região eliminada com sucesso!');
            closeDeleteModal();
            // Reload table or remove row
            // loadRegiaoTable();
        }
        
        // Close modal on background click
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteModal();
            }
        });
        
        function initTableSearch() {
            const searchInput = document.querySelector('input[type="text"]');
            if (searchInput) {
                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    const rows = document.querySelectorAll('tbody tr');
                    
                    rows.forEach(row => {
                        const text = row.textContent.toLowerCase();
                        row.style.display = text.includes(term) ? '' : 'none';
                    });
                });
            }
        }
    </script>
</body>
</html>
