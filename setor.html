    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">

<body class="bg-background text-on-background min-h-screen">
    <!-- SideNavBar Container -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Wrapper -->
    <main class="ml-[280px] min-h-screen flex flex-col">
        <!-- TopNavBar Container -->
        <div id="topnav-container"></div>
        
        <!-- Setor Content -->
        <div class="p-container-padding-desktop max-w-[1440px] mx-auto w-full space-y-section-gap pt-24">
            <!-- Header -->
            <div id="setor-header-container"></div>
            
            <!-- Stats -->
            <div id="setor-stats-container"></div>
            
            <!-- Table -->
            <div id="setor-table-container"></div>
            
            <!-- Tips -->
            <div id="setor-tips-container"></div>
        </div>
    </main>
    
    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white rounded-[24px] p-8 max-w-md w-full mx-4 card-shadow">
            <div class="flex items-center justify-center w-16 h-16 rounded-full bg-error-container/20 mx-auto mb-4">
                <span class="material-symbols-outlined text-error text-4xl">delete_forever</span>
            </div>
            <h3 class="text-headline-sm font-headline-sm text-on-surface text-center mb-2">Confirmar Eliminação</h3>
            <p class="text-body-md text-on-surface-variant text-center mb-6">Tem a certeza que deseja eliminar o setor <span id="deleteSetorName" class="font-bold text-primary"></span>? Esta ação não pode ser desfeita.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 px-4 py-3 rounded-full border border-secondary text-secondary font-bold hover:bg-surface-container-low transition-all">
                    Cancelar
                </button>
                <button onclick="confirmDelete()" class="flex-1 px-4 py-3 rounded-full bg-error text-white font-bold hover:bg-error/90 transition-all shadow-sm">
                    Eliminar
                </button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="script.js"></script>
    <script>
        // Load setor page content
        document.addEventListener('DOMContentLoaded', function() {
            loadSetorContent();
        });
        
        // Delete functionality
        let deleteId = null;
        
        function openDeleteModal(id, name) {
            deleteId = id;
            document.getElementById('deleteSetorName').textContent = name;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
            deleteId = null;
        }
        
        function confirmDelete() {
            console.log('Deleting sector with ID:', deleteId);
            alert('Setor eliminado com sucesso!');
            closeDeleteModal();
        }
        
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteModal();
            }
        });
    </script>
</body>
</html>
