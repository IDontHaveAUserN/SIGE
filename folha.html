</head>
<body class="bg-background text-on-background min-h-screen">
    <!-- SideNavBar Container -->
    <div id="sidebar-container"></div>
    
    <!-- Main Content Wrapper -->
    <main class="ml-[280px] min-h-screen flex flex-col">
        <!-- TopNavBar Container -->
        <div id="topnav-container"></div>
        
        <!-- Folha Content -->
        <div class="p-container-padding-desktop max-w-[1440px] mx-auto w-full space-y-section-gap pt-24">
            <!-- Header -->
            <div id="folha-header-container"></div>
            
            <!-- Stats -->
            <div id="folha-stats-container"></div>
            
            <!-- Table -->
            <div id="folha-table-container"></div>
            
            <!-- Tips -->
            <div id="folha-tips-container"></div>
        </div>
    </main>
    
    <!-- Delete Confirmation Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center">
        <div class="bg-white rounded-[24px] p-8 max-w-md w-full mx-4 card-shadow">
            <div class="flex items-center justify-center w-16 h-16 rounded-full bg-error-container/20 mx-auto mb-4">
                <span class="material-symbols-outlined text-error text-4xl">delete_forever</span>
            </div>
            <h3 class="text-headline-sm font-headline-sm text-on-surface text-center mb-2">Confirmar Eliminação</h3>
            <p class="text-body-md text-on-surface-variant text-center mb-6">Tem a certeza que deseja eliminar a folha <span id="deleteFolhaName" class="font-bold text-primary"></span>? Esta ação não pode ser desfeita.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 px-4 py-3 rounded-full border border-secondary text-secondary font-bold hover:bg-surface-container-low transition-all">
                    Cancelar
                </button>
                <button onclick="confirmDelete()" class="flex-1 px-4 py-3 rounded-full bg-error text-white font-bold hover:bg-error/90 transition-all shadow-sm">
                    Eliminar
                </button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="script.js"></script>
    <script>
        // Load folha page content
        document.addEventListener('DOMContentLoaded', function() {
            loadFolhaContent();
        });
        
        // Delete functionality
        let deleteId = null;
        
        function openDeleteModal(id, name) {
            deleteId = id;
            document.getElementById('deleteFolhaName').textContent = name;
            document.getElementById('deleteModal').classList.remove('hidden');
            document.getElementById('deleteModal').classList.add('flex');
        }
        
        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            document.getElementById('deleteModal').classList.remove('flex');
            deleteId = null;
        }
        
        function confirmDelete() {
            console.log('Deleting folha with ID:', deleteId);
            alert('Folha eliminada com sucesso!');
            closeDeleteModal();
        }
        
        document.getElementById('deleteModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeDeleteModal();
            }
        });

        // Certificate/Diploma Generation Function
        function generateCertificateForStudent(id, name, processNumber, school, region, sector, year, level, average, completionDate, subjects, documentType) {
    const studentData = {
        id: id,
        name: name,
        processNumber: processNumber,
        school: school,
        region: region,
        sector: sector,
        year: year,
        level: level,
        average: average,
        completionDate: completionDate,
        subjects: subjects
    };
    
    generateCertificate(studentData, documentType);
}

function generateCertificate(studentData, documentType) {
    // Create the certificate HTML content with simplified design that renders properly
    const certificateHTML = `
        <div id="certificate-container" style="
            width: 1100px;
            padding: 40px 50px;
            margin: 0 auto;
            font-family: 'Times New Roman', Georgia, serif;
            background: #fffdf8;
            border: 12px double #b8860b;
            position: relative;
            min-height: 780px;
            box-sizing: border-box;
        ">
            <!-- Inner Border -->
            <div style="
                position: absolute;
                top: 15px;
                left: 15px;
                right: 15px;
                bottom: 15px;
                border: 2px solid #b8860b;
                pointer-events: none;
            "></div>

            <!-- Top Section: Emblem and Flag -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 2px solid #b8860b;">
                <!-- Left: Emblem -->
                <div style="text-align: center; width: 140px;">
                    <div style="
                        width: 80px;
                        height: 80px;
                        border: 3px solid #b8860b;
                        border-radius: 50%;
                        display: inline-flex;
                        align-items: center;
                        justify-content: center;
                        background: #f5f0e8;
                        font-size: 38px;
                        color: #1a1a1a;
                    ">
                        🌍
                    </div>
                    <div style="font-size: 9px; text-align: center; margin-top: 4px; font-weight: bold; color: #1a1a1a; line-height: 1.2;">
                        REPÚBLICA DA<br>GUINÉ-BISSAU
                    </div>
                </div>
                
                <!-- Center: Ministry -->
                <div style="text-align: center; flex: 1; padding: 0 15px;">
                    <div style="font-size: 16px; font-weight: bold; letter-spacing: 2px; color: #1a1a1a; text-transform: uppercase;">
                        Ministério da Educação
                    </div>
                    <div style="font-size: 11px; color: #555; margin-top: 2px; letter-spacing: 1px;">
                        Direção-Geral do Ensino
                    </div>
                    <div style="
                        width: 200px;
                        height: 2px;
                        background: #b8860b;
                        margin: 6px auto;
                    "></div>
                    <div style="font-size: 12px; color: #444; font-weight: 500;">
                        ${studentData.school}
                    </div>
                </div>
                
                <!-- Right: Flag -->
                <div style="text-align: center; width: 140px;">
                    <div style="
                        width: 90px;
                        height: 56px;
                        border: 2px solid #b8860b;
                        display: inline-block;
                        position: relative;
                    ">
                        <div style="
                            position: absolute;
                            left: 0;
                            top: 0;
                            bottom: 0;
                            width: 28%;
                            background: #009e49;
                        "></div>
                        <div style="
                            position: absolute;
                            left: 28%;
                            top: 0;
                            right: 0;
                            height: 50%;
                            background: #fcec0c;
                        "></div>
                        <div style="
                            position: absolute;
                            left: 28%;
                            bottom: 0;
                            right: 0;
                            height: 50%;
                            background: #ce1126;
                        "></div>
                        <div style="
                            position: absolute;
                            left: 14%;
                            top: 50%;
                            transform: translate(-50%, -50%);
                            width: 12px;
                            height: 12px;
                            background: #1a1a1a;
                            border-radius: 50%;
                            border: 1px solid #333;
                        "></div>
                    </div>
                </div>
            </div>

            <!-- Title -->
            <div style="text-align: center; margin: 15px 0 10px;">
                <h1 style="
                    font-size: 36px;
                    font-weight: bold;
                    letter-spacing: 5px;
                    text-transform: uppercase;
                    color: #1a1a1a;
                    margin: 0;
                    font-family: 'Times New Roman', serif;
                ">${documentType}</h1>
                <div style="
                    width: 250px;
                    height: 2px;
                    background: #b8860b;
                    margin: 6px auto;
                "></div>
                <p style="font-size: 13px; color: #666; margin: 3px 0 0; font-style: italic; letter-spacing: 1px;">
                    Documento Oficial de Autenticação Académica
                </p>
            </div>

            <!-- Certificate Number -->
            <div style="text-align: right; margin-bottom: 10px; font-size: 11px; color: #888;">
                <strong>Nº:</strong> ${documentType === 'Diploma' ? 'DIP' : 'CER'}-${studentData.processNumber.replace('#', '')}-${new Date().getFullYear()}
            </div>

            <!-- Main Content -->
            <div style="
                padding: 10px 20px;
                line-height: 2;
                font-size: 14px;
                text-align: justify;
                background: rgba(255,255,255,0.6);
                border-radius: 4px;
                border: 1px solid #e8e0d0;
            ">
                <p style="text-align: center; font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #1a1a1a; letter-spacing: 1px;">
                    CERTIFICA-SE PARA OS DEVIDOS EFEITOS LEGAIS QUE
                </p>

                <p style="text-align: center; font-size: 22px; font-weight: bold; margin: 10px 0; letter-spacing: 1px; color: #1a1a1a;">
                    ${studentData.name}
                </p>

                <p style="text-align: center; margin-bottom: 10px;">
                    <span style="font-size: 12px; color: #777;">Processo Nº ${studentData.processNumber}</span>
                </p>

                <p style="text-indent: 30px; margin: 8px 0;">
                    Concluiu com aproveitamento o <strong>${studentData.level}</strong> na <strong>${studentData.school}</strong>,
                    localizada na <strong>${studentData.region}</strong>, <strong>${studentData.sector}</strong>,
                    no ano letivo de <strong>${studentData.year}</strong>.
                </p>

                <p style="text-indent: 30px; margin: 8px 0;">
                    Obteve as seguintes classificações finais:
                </p>

                <!-- Grades Table -->
                <table style="
                    width: 65%;
                    margin: 10px auto;
                    border-collapse: collapse;
                    font-size: 13px;
                    border: 1px solid #b8860b;
                ">
                    <thead>
                        <tr style="background: #b8860b;">
                            <th style="padding: 6px 12px; text-align: left; border: 1px solid #b8860b; color: white; font-weight: bold;">Disciplina</th>
                            <th style="padding: 6px 12px; text-align: center; border: 1px solid #b8860b; color: white; font-weight: bold;">Classificação</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${studentData.subjects.map((subject, index) => `
                            <tr style="${index % 2 === 0 ? 'background: #faf8f4;' : 'background: #f5f0e8;'}">
                                <td style="padding: 5px 12px; border: 1px solid #d4c4a0;">${subject.name}</td>
                                <td style="padding: 5px 12px; text-align: center; border: 1px solid #d4c4a0; font-weight: bold;">${subject.grade} valores</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>

                <p style="text-align: center; margin: 10px 0; font-size: 15px;">
                    <strong>Média Final:</strong> <span style="font-size: 20px; color: #b8860b; font-weight: bold;">${studentData.average}</span> valores
                </p>

                <p style="text-indent: 30px; margin: 8px 0;">
                    Cumprindo com todas as exigências do <strong>Ministério da Educação da República da Guiné-Bissau</strong>.
                </p>

                <p style="text-align: center; margin: 12px 0 8px; font-size: 15px; color: #1a1a1a;">
                    <strong>Data de Conclusão: ${studentData.completionDate}</strong>
                </p>
            </div>

            <!-- Signatures -->
            <div style="
                margin-top: 20px;
                padding-top: 12px;
                border-top: 2px solid #b8860b;
                display: flex;
                justify-content: space-around;
                text-align: center;
            ">
                <div style="flex: 1;">
                    <div style="
                        width: 160px;
                        height: 1px;
                        background: #1a1a1a;
                        margin: 0 auto 6px;
                    "></div>
                    <p style="font-size: 12px; margin: 0; font-weight: bold; color: #1a1a1a;">
                        Diretor(a) da Escola
                    </p>
                    <p style="font-size: 10px; color: #777; margin: 2px 0 0;">
                        ${studentData.school}
                    </p>
                </div>
                <div style="flex: 1;">
                    <div style="
                        width: 160px;
                        height: 1px;
                        background: #1a1a1a;
                        margin: 0 auto 6px;
                    "></div>
                    <p style="font-size: 12px; margin: 0; font-weight: bold; color: #1a1a1a;">
                        Presidente do Conselho Pedagógico
                    </p>
                    <p style="font-size: 10px; color: #777; margin: 2px 0 0;">
                        ${studentData.school}
                    </p>
                </div>
                <div style="flex: 1;">
                    <div style="
                        width: 160px;
                        height: 1px;
                        background: #1a1a1a;
                        margin: 0 auto 6px;
                    "></div>
                    <p style="font-size: 12px; margin: 0; font-weight: bold; color: #1a1a1a;">
                        Delegado do Ministério da Educação
                    </p>
                    <p style="font-size: 10px; color: #777; margin: 2px 0 0;">
                        ${studentData.region}
                    </p>
                </div>
            </div>

            <!-- Bottom Footer -->
            <div style="
                margin-top: 15px;
                padding-top: 10px;
                border-top: 2px solid #b8860b;
                text-align: center;
                font-size: 9px;
                color: #888;
            ">
                <p style="margin: 0;">
                    Este documento é válido para todos os efeitos legais, nos termos da legislação em vigor.
                </p>
                <p style="margin: 2px 0 0;">
                    Autenticado pelo <strong style="color: #b8860b;">Ministério da Educação da República da Guiné-Bissau</strong>
                </p>
                <p style="margin: 2px 0 0; font-weight: bold; font-size: 8px; letter-spacing: 1px; color: #b8860b;">
                    ${documentType.toUpperCase()} AUTENTICADO • ${new Date().getFullYear()}
                </p>
            </div>

            <!-- QR Code -->
            <div style="
                position: absolute;
                bottom: 30px;
                right: 30px;
                width: 50px;
                height: 50px;
                border: 1px solid #b8860b;
                border-radius: 3px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 8px;
                color: #999;
                background: #faf8f4;
            ">
                QR CODE
            </div>
        </div>
    `;

    // Create a temporary container
    const container = document.createElement('div');
    container.innerHTML = certificateHTML;
    container.style.position = 'absolute';
    container.style.left = '-9999px';
    container.style.top = '0';
    container.style.zIndex = '9999';
    document.body.appendChild(container);

    // Wait for rendering
    setTimeout(() => {
        const element = document.getElementById('certificate-container');
        
        if (!element) {
            console.error('Certificate container not found');
            document.body.removeChild(container);
            return;
        }

        // Generate PDF with proper settings
        const opt = {
            margin: 0,
            filename: `${documentType}_${studentData.name.replace(/\s+/g, '_')}_${studentData.processNumber.replace('#', '')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2, 
                useCORS: true,
                logging: false,
                width: 1100,
                height: 780,
                scrollY: 0,
                scrollX: 0,
                windowWidth: 1100,
                windowHeight: 780
            },
            jsPDF: { 
                unit: 'px', 
                format: [1100, 780], 
                orientation: 'landscape'
            },
            pagebreak: { mode: 'avoid-all' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            document.body.removeChild(container);
        }).catch((error) => {
            console.error('PDF generation error:', error);
            document.body.removeChild(container);
        });
    }, 500);
}
</script>
    </script>
</body>
</html>
