<script>
    // Carimbo Upload Functionality
    document.addEventListener('DOMContentLoaded', function() {
        const carimboContainer = document.getElementById('carimboContainer');
        const carimboFileInput = document.getElementById('carimboFileInput');
        const carimboPlaceholder = document.getElementById('carimboPlaceholder');
        const carimboPreview = document.getElementById('carimboPreview');
        const carimboPreviewImage = document.getElementById('carimboPreviewImage');
        const carimboFileName = document.getElementById('carimboFileName');
        const removeCarimboBtn = document.getElementById('removeCarimboBtn');

        // File selection
        carimboFileInput.addEventListener('change', function(e) {
            const file = this.files[0];
            if (file) {
                handleCarimboFile(file);
            }
        });

        // Handle file
        function handleCarimboFile(file) {
            // Validate file type
            const validTypes = ['image/png', 'image/jpeg', 'image/svg+xml', 'application/pdf'];
            if (!validTypes.includes(file.type)) {
                alert('Formato inválido. Por favor, carregue PNG, JPG, SVG ou PDF.');
                return;
            }

            // Validate file size (max 2MB)
            if (file.size > 2 * 1024 * 1024) {
                alert('O ficheiro excede o tamanho máximo de 2MB.');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                carimboPreviewImage.src = e.target.result;
                carimboFileName.textContent = file.name;
                carimboPlaceholder.classList.add('hidden');
                carimboPreview.classList.remove('hidden');
                carimboContainer.classList.remove('border-dashed');
                carimboContainer.classList.add('border-solid', 'border-[#667eea]');
            };
            reader.readAsDataURL(file);
        }

        // Remove carimbo
        removeCarimboBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            carimboPlaceholder.classList.remove('hidden');
            carimboPreview.classList.add('hidden');
            carimboFileInput.value = '';
            carimboContainer.classList.add('border-dashed');
            carimboContainer.classList.remove('border-solid', 'border-[#667eea]');
        });
    });
</script>
