<!-- 6. DOCUMENTOS ENTREGUES -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-outline-variant/30 overflow-hidden">
    <div class="px-4 py-2.5 border-b border-surface-container-high bg-surface-container-low/50">
        <h3 class="text-sm font-bold text-[#667eea]">6. DOCUMENTOS ENTREGUES</h3>
    </div>
    <div class="p-4">
        <!-- Documentos Checkboxes -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Coluna 1 -->
            <div class="space-y-2.5">
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="bi"/> 
                    Cópia de Bilhete de Identidade
                </label>
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="cp"/> 
                    Cópia de Cédula Pessoal
                </label>
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="cn"/> 
                    Cópia de Certidão de Nascimento
                </label>
            </div>
            <!-- Coluna 2 -->
            <div class="space-y-2.5">
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="cv"/> 
                    Cópia de Cartão de Vacina
                </label>
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="ccf"/> 
                    Cópia de Certificado / Certidão de Frequência
                </label>
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="dec"/> 
                    Declaração
                </label>
            </div>
            <!-- Coluna 3 -->
            <div class="space-y-2.5">
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="foto"/> 
                    2 Fotografias Tipo Passe
                </label>
                <label class="flex items-center gap-2 text-xs text-on-surface-variant cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="cr"/> 
                    Comprovativo de Residência
                </label>
                <div class="flex items-center gap-2">
                    <input type="checkbox" class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1 document-checkbox" data-doc="outros"/>
                    <span class="text-xs text-on-surface-variant whitespace-nowrap">Outros:</span>
                    <input type="text" class="flex-1 h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all" placeholder="Especifique"/>
                </div>
            </div>
        </div>

        <!-- Document Annex Section -->
        <div class="mt-4 p-4 bg-surface-container-low/30 rounded-lg border border-outline-variant/30">
            <div class="flex items-center justify-between mb-3">
                <h4 class="text-sm font-semibold text-[#667eea]">Anexos dos Documentos</h4>
                <span class="text-xs text-on-surface-variant" id="annexCount">0 anexo(s) selecionado(s)</span>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="annexContainer">
                <!-- Annex items will be dynamically added here -->
            </div>

            <!-- Add Annex Button -->
            <button type="button" id="addAnnexBtn" class="mt-3 flex items-center gap-2 text-xs text-[#667eea] hover:text-[#764ba2] transition-colors font-medium">
                <span class="material-symbols-outlined text-[18px]">add_circle</span>
                Adicionar Anexo
            </button>
        </div>

        <!-- Atenção -->
        <div class="text-center p-3 border-t border-outline-variant/30 mt-4 flex flex-col items-center justify-center gap-2 text-[10px] text-secondary bg-surface-container-low/30 rounded-lg">
            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-[16px] text-[#667eea]">warning</span>
                <span class="font-medium">ATENÇÃO! ESTA PARTE DEVE SER PREENCHIDA PELA ENTIDADE QUE REALIZA A MATRÍCULA</span>
            </div>
            <div class="flex items-center gap-4 text-[9px] text-on-surface-variant">
                <span>📄 Formatos aceites: PDF</span>
                <span>📊 Tamanho máximo: 5MB</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Document Annex Management
    document.addEventListener('DOMContentLoaded', function() {
        let annexCount = 0;
        const annexContainer = document.getElementById('annexContainer');
        const annexCountDisplay = document.getElementById('annexCount');
        const addAnnexBtn = document.getElementById('addAnnexBtn');

        // Document type mapping for annex
        const docTypes = {
            'bi': 'Bilhete de Identidade',
            'cp': 'Cédula Pessoal',
            'cn': 'Certidão de Nascimento',
            'cv': 'Cartão de Vacina',
            'ccf': 'Certificado de Frequência',
            'dec': 'Declaração',
            'foto': 'Fotografias',
            'cr': 'Comprovativo de Residência',
            'outros': 'Outros Documentos'
        };

        // Function to update annex count
        function updateAnnexCount() {
            const annexItems = annexContainer.querySelectorAll('.annex-item');
            annexCount = annexItems.length;
            annexCountDisplay.textContent = `${annexCount} anexo(s) selecionado(s)`;
        }

        // Function to get selected documents
        function getSelectedDocuments() {
            const checkboxes = document.querySelectorAll('.document-checkbox:checked');
            const selected = [];
            checkboxes.forEach(cb => {
                const docKey = cb.dataset.doc;
                if (docTypes[docKey]) {
                    selected.push(docTypes[docKey]);
                } else {
                    // For "Outros", get the input value
                    const parent = cb.closest('.flex');
                    if (parent) {
                        const input = parent.querySelector('input[type="text"]');
                        if (input && input.value.trim()) {
                            selected.push(input.value.trim());
                        } else {
                            selected.push('Outro Documento');
                        }
                    }
                }
            });
            return selected;
        }

        // Add annex item
        function addAnnexItem(docName) {
            const annexItem = document.createElement('div');
            annexItem.className = 'annex-item flex items-center gap-3 p-3 bg-surface rounded-lg border border-outline-variant/30';
            
            // Get file size (simulated)
            const fileSize = (Math.random() * 4 + 0.5).toFixed(1);
            
            annexItem.innerHTML = `
                <span class="material-symbols-outlined text-[#667eea] text-[20px]">description</span>
                <div class="flex-1 min-w-0">
                    <p class="text-xs font-medium text-on-surface truncate">${docName}</p>
                    <div class="flex items-center gap-3 text-[10px] text-on-surface-variant">
                        <span>📄 PDF</span>
                        <span>📊 ${fileSize} MB</span>
                        <span class="text-[#667eea]">● Anexado</span>
                    </div>
                </div>
                <button type="button" class="remove-annex p-1 hover:bg-error-container/20 rounded-full transition-colors" title="Remover anexo">
                    <span class="material-symbols-outlined text-[16px] text-error">close</span>
                </button>
            `;
            
            annexContainer.appendChild(annexItem);
            updateAnnexCount();

            // Remove annex functionality
            annexItem.querySelector('.remove-annex').addEventListener('click', function() {
                annexItem.remove();
                updateAnnexCount();
            });
        }

        // Add annex button click
        addAnnexBtn.addEventListener('click', function() {
            const selectedDocs = getSelectedDocuments();
            
            if (selectedDocs.length === 0) {
                alert('Por favor, selecione pelo menos um documento para anexar.');
                return;
            }

            // Add annex for each selected document
            selectedDocs.forEach(doc => {
                // Check if annex already exists for this document
                const existing = annexContainer.querySelectorAll('.annex-item');
                let exists = false;
                existing.forEach(item => {
                    if (item.querySelector('.text-xs').textContent === doc) {
                        exists = true;
                    }
                });
                
                if (!exists) {
                    addAnnexItem(doc);
                }
            });
        });

        // Auto-add annex when checkbox is checked
        document.querySelectorAll('.document-checkbox').forEach(checkbox => {
            checkbox.addEventListener('change', function() {
                if (this.checked) {
                    const docKey = this.dataset.doc;
                    let docName = docTypes[docKey] || 'Outro Documento';
                    
                    // For "Outros", get the input value
                    if (docKey === 'outros') {
                        const parent = this.closest('.flex');
                        if (parent) {
                            const input = parent.querySelector('input[type="text"]');
                            if (input && input.value.trim()) {
                                docName = input.value.trim();
                            }
                        }
                    }
                    
                    // Check if annex already exists
                    const existing = annexContainer.querySelectorAll('.annex-item');
                    let exists = false;
                    existing.forEach(item => {
                        if (item.querySelector('.text-xs').textContent === docName) {
                            exists = true;
                        }
                    });
                    
                    if (!exists) {
                        addAnnexItem(docName);
                    }
                }
            });
        });

        // "Outros" input - auto-add annex when typing
        const outrosInput = document.querySelector('.flex input[type="text"]');
        if (outrosInput) {
            outrosInput.addEventListener('blur', function() {
                if (this.value.trim()) {
                    const checkbox = this.closest('.flex').querySelector('.document-checkbox');
                    if (checkbox && checkbox.checked) {
                        const docName = this.value.trim();
                        const existing = annexContainer.querySelectorAll('.annex-item');
                        let exists = false;
                        existing.forEach(item => {
                            if (item.querySelector('.text-xs').textContent === docName) {
                                exists = true;
                            }
                        });
                        if (!exists) {
                            addAnnexItem(docName);
                        }
                    }
                }
            });
        }

        // Initial update
        updateAnnexCount();
    });
</script>
