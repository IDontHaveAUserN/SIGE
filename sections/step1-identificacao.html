<!-- Header Section -->
<main class="mt-1 p-4 max-w-5xl mx-auto flex flex-col gap-4">
    <!-- Header/Photo Area Bento Grid -->
    <div
        class="grid grid-cols-12 gap-3 bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-outline-variant/30 p-4">
        <!-- Photo Placeholder -->
        <div class="col-span-12 md:col-span-2 flex flex-col items-center justify-center gap-2">
            <div
                class="w-20 h-28 bg-surface-container rounded-lg border-2 border-dashed border-outline-variant flex items-center justify-center relative overflow-hidden group hover:border-primary transition-colors cursor-pointer">
                <span
                    class="material-symbols-outlined text-2xl text-outline group-hover:text-primary transition-colors">add_a_photo</span>
                <input class="absolute inset-0 opacity-0 cursor-pointer" type="file" />
            </div>
            <span class="text-[10px] text-on-surface-variant">Foto 3x4</span>
        </div>
        <!-- Essential Info Form -->
        <div class="col-span-12 md:col-span-10 grid grid-cols-1 md:grid-cols-2 gap-3">
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Ano / Classe</label>
                <select
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all">
                    <option>Selecionar Classe</option>
                    <option>1º Ano</option>
                    <option>2º Ano</option>
                </select>
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Grupo</label>
                <select
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all">
                    <option>Selecionar Grupo</option>
                    <option>Grupo A</option>
                    <option>Grupo B</option>
                </select>
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Nº do Aluno</label>
                <input
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                    placeholder="Ex: AL-2024-001" type="text" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Idade</label>
                <input
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                    placeholder="Digite a idade" type="number" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface mb-0.5">Sexo</label>
                <div class="flex gap-3">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input class="w-3.5 h-3.5 text-[#667eea] focus:ring-[#667eea] focus:ring-1" name="gender"
                            type="radio" />
                        <span class="text-sm">Masculino</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input class="w-3.5 h-3.5 text-[#667eea] focus:ring-[#667eea] focus:ring-1" name="gender"
                            type="radio" />
                        <span class="text-sm">Feminino</span>
                    </label>
                </div>
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface mb-0.5">Opções</label>
                <div class="flex gap-3">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1"
                            type="checkbox" />
                        <span class="text-sm">Inglês</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input class="w-3.5 h-3.5 rounded text-[#667eea] focus:ring-[#667eea] focus:ring-1"
                            type="checkbox" />
                        <span class="text-sm">Francês</span>
                    </label>
                </div>
            </div>
        </div>
    </div>
    <!-- 1. IDENTIFICAÇÃO DO(A) ALUNO(A) -->
    <section
        class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.04)] border border-outline-variant/30 overflow-hidden">
        <div class="px-4 py-2.5 border-b border-surface-container-high bg-surface-container-low/50">
            <h3 class="text-sm font-bold text-[#667eea]">1. IDENTIFICAÇÃO DO(A) ALUNO(A)</h3>
        </div>
        <div class="p-4 grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-3">
            <!-- Row 1 -->
            <div class="md:col-span-2 flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Nome Completo</label>
                <input
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                    placeholder="Digite o nome completo" type="text" />
            </div>
            <!-- Row 2 -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Data de Nascimento</label>
                <input
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                    type="date" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Natural de</label>
                <input
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                    placeholder="Cidade, País" type="text" />
            </div>
            <!-- Row 3 -->
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Setor</label>
                <input
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                    placeholder="Digite o setor" type="text" />
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-[11px] font-medium text-on-surface">Região</label>
                <select
                    class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all">
                    <option>Selecionar Região</option>
                    <option>Norte</option>
                    <option>Sul</option>
                </select>
            </div>
            <!-- Document Info Sub-section -->
            <div class="md:col-span-2 mt-1">
                <h4
                    class="text-[11px] font-medium text-on-surface-variant mb-2 pb-1.5 border-b border-surface-container-high">
                    Informações do Documento de Identidade
                </h4>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-medium text-on-surface">Tipo de Documento</label>
                        <select
                            class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all">
                            <option>Bilhete de Identidade</option>
                            <option>Passaporte</option>
                            <option>Cédula Pessoal</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-medium text-on-surface">Número do Documento</label>
                        <input
                            class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                            placeholder="Digite o número" type="text" />
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-medium text-on-surface">Data de Emissão</label>
                        <input
                            class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                            type="date" />
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[11px] font-medium text-on-surface">Passado por</label>
                        <input
                            class="w-full h-8 bg-surface rounded-md border-0 px-2 text-sm focus:outline-none focus:ring-2 focus:ring-[#667eea] transition-all"
                            placeholder="Ex: Arquivo de Identificação" type="text" />
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
